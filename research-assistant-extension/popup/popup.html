<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Annotate</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="popup-container">
            <div class="popup-header">
                <h1>Annotate</h1>
            </div>

            <div class="task-selector-group">
                <label class="section-label">CURRENT CONTEXT</label>
                <div class="select-wrapper">
                    <select id="task-dropdown">
                        <option value="">No Active Task</option>
                        </select>
                    <svg class="select-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
            </div>

            <div class="quick-actions">
                <button id="open-workspace" class="action-btn primary">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    </svg>
                    Workspace
                </button>

                <button id="new-task" class="action-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Task
                </button>

                <button id="toggle-notes" class="action-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    Toggle Sidebar
                </button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="active-tasks">0</div>
                    <div class="stat-label">Tasks</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="total-notes">0</div>
                    <div class="stat-label">Notes</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="open-tabs">0</div>
                    <div class="stat-label">Tabs</div>
                </div>
            </div>
        </div>
        <script src="popup.js"></script>
    </body>
</html>
